cat > .github/workflows/deploy.yml <<'EOF'
name: Deploy BeeSaurus

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BeeSaurus/package-lock.json

      - name: Instalar dependências
        working-directory: ./BeeSaurus
        run: npm ci

      - name: Gerar site
        working-directory: ./BeeSaurus
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./BeeSaurus/build

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar site
        id: deploymentls -la .github/workflows
        uses: actions/deploy-pages@v4
EOF